const PERIODS=[['hoy','Hoy'],['ayer','Ayer'],['7','7 días'],['30','30 días'],['todo','Todo']];
function periodRange(k){const t=now(),s=startOfDay(t);
  if(k==='hoy')return [s,s+DAY];if(k==='ayer')return [s-DAY,s];if(k==='7')return [s-6*DAY,s+DAY];if(k==='30')return [s-29*DAY,s+DAY];return [0,s+DAY*2];}
function lowItems(){return S.items.filter(i=>!i.archived&&i.kind!=='herramienta'&&((i.min>0&&stockOf(i.id)<=i.min)||stockOf(i.id)<0)).sort((a,b)=>(stockOf(a.id)-a.min)-(stockOf(b.id)-b.min));}
function lateOrders(){return S.orders.filter(o=>!ST[o.status].terminal&&isLate(o)).sort((a,b)=>a.stateSince-b.stateSince);}
function activeOrders(){return S.orders.filter(o=>!ST[o.status].terminal);}
function revenueIn(a,b){
  let svc=0,cnt=0;for(const o of deliveredBetween(a,b)){svc+=quoteTotals(o).total;cnt++;}
  let sales=0;for(const s of S.sales)if(s.status==='ok'&&s.ts>=a&&s.ts<b)sales+=s.totalCents;
  return {svc,sales,cnt,total:svc+sales};
}
function cobradoIn(a,b){let t=0;for(const p of S.payments){if(p.voidedAt||p.ts<a||p.ts>=b)continue;for(const l of p.lines)if(l.m!=='cc'&&l.verified)t+=l.a;}return t;}
function marginIn(a,b){let rev=0,cost=0;for(const o of deliveredBetween(a,b)){const e=orderEconomics(o);rev+=e.rev;cost+=e.cost;}
  for(const s of S.sales)if(s.status==='ok'&&s.ts>=a&&s.ts<b){rev+=s.totalCents;cost+=sum(s.items,l=>Math.round(l.qty*l.costCents));}
  return {rev,cost,margin:rev-cost};}
function ccTotal(){return sum(S.clients,c=>Math.max(0,ccBalance(c.id)));}
function pendingDigital(){return sum(S.payments.filter(p=>!p.voidedAt),p=>sum(p.lines.filter(l=>!l.verified),l=>l.a));}
function oldOpenCash(){const s=openSession();return s&&startOfDay(s.openedAt)<startOfDay(now())?s:null;}
function chartBars(id,items,names,colors){
  const W=640,H=230,pl=44,pr=8,pt=18,pb=34;const n=items.length;if(!n)return '<div class="empty">Sin datos suficientes</div>';
  const max=Math.max(1,...items.map(i=>sum(i.v,x=>x)));const nice=(()=>{const p=Math.pow(10,Math.floor(Math.log10(max)));const m=max/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p;})();
  const bw=(W-pl-pr)/n,gap=Math.min(8,bw*.25);let g='';
  for(let k=0;k<=3;k++){const y=pt+(H-pt-pb)*(1-k/3);g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#e1e7eb"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end">'+esc(shortMoney(nice*k/3))+'</text>';}
  items.forEach((it,i)=>{let y0=H-pb;const x=pl+i*bw+gap/2,w=bw-gap;
    it.v.forEach((v,j)=>{const h=(H-pt-pb)*v/nice;if(h<=0)return;y0-=h;g+='<rect x="'+x.toFixed(1)+'" y="'+y0.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+colors[j]+'"><title>'+esc(it.label+' · '+names[j]+': '+fmt(v))+'</title></rect>';});
    const tot=sum(it.v,x=>x);if(n<=16&&tot>0)g+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(y0-4).toFixed(1)+'" text-anchor="middle" font-weight="700">'+esc(shortMoney(tot))+'</text>';
    if(n<=16||i%Math.ceil(n/12)===0)g+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-pb+15)+'" text-anchor="middle">'+esc(it.label)+'</text>';});
  const leg=names.map((nm,j)=>'<span class="row gap-s"><i class="dot" style="background:'+colors[j]+'"></i><span class="sm">'+esc(nm)+'</span></span>').join('');
  const tbl='<details style="margin-top:8px"><summary class="sm" style="cursor:pointer;min-height:32px">Ver como tabla</summary>'+tableWrap('<table class="tbl"><thead><tr><th>Día</th>'+names.map(n2=>'<th class="r">'+esc(n2)+'</th>').join('')+'<th class="r">Total</th></tr></thead><tbody>'+items.map(it=>'<tr><td>'+esc(it.label)+'</td>'+it.v.map(v=>'<td class="r num">'+esc(fmt(v))+'</td>').join('')+'<td class="r num"><b>'+esc(fmt(sum(it.v,x=>x)))+'</b></td></tr>').join('')+'</tbody></table>')+'</details>';
  return '<div class="row" style="margin-bottom:6px">'+leg+'</div><svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ingresos por día">'+g+'</svg>'+tbl;
}
function shortMoney(c){const p=c/100;if(p>=1e6)return '$'+(p/1e6).toFixed(1).replace('.',',')+' M';if(p>=1e3)return '$'+Math.round(p/1e3)+' k';return '$'+Math.round(p);}

function bindKanban(){

  kb.querySelectorAll('.kcol').forEach(col=>{col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('over');});col.addEventListener('dragleave',()=>col.classList.remove('over'));
    col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('over');const id=e.dataTransfer.getData('text/plain');if(id)moveFlow(id,col.dataset.col);});});

function moveFlow(id,to){
  const o=getOrder(id);if(o.status===to)return;
  const forward=ST_FLOW.indexOf(to)>ST_FLOW.indexOf(o.status);
  if(to==='entregado')return deliverFlow(id);
  if(to==='cancelado'){return confirmBox({title:'Cancelar '+otCode(o),html:'La orden se cierra como cancelada y los repuestos reservados se liberan. No se puede deshacer.',ok:'Cancelar orden',danger:true,reason:true,onOk:r=>{orderMove(id,'cancelado',{reason:r});toast('Orden cancelada.','ok');}});}
  if(!forward){return confirmBox({title:'Volver a «'+ST[to].name+'»',html:'Vas a retroceder '+esc(otCode(o))+' de «'+esc(ST[o.status].name)+'». Queda registrado quién y por qué.',ok:'Retroceder',reason:true,onOk:r=>{orderMove(id,to,{reason:r});toast(otCode(o)+' vuelve a '+ST[to].name+'.','ok');}});}
  const r=run(()=>orderMove(id,to));if(r!==undefined)toast(otCode(o)+' → '+ST[to].name,'ok');
}
function deliverFlow(id){
  const o=getOrder(id);if(o.status!=='listo'){toast('Sólo se entrega un equipo que está «Listo para retirar».','bad');return;}

    +(op.pend>0?'<div class="alert warn">'+ic('alert',18)+'Hay un cobro digital sin verificar ('+esc(fmt(op.pend))+'). Verificá la acreditación antes de entregar.</div>':'')
    +(op.due>0?'<div class="alert warn">'+ic('alert',18)+'Falta cobrar '+esc(fmt(op.due))+' para poder entregar.</div>':'')+(op.due<0?'<div class="alert warn">El cliente tiene saldo a favor: registrá el reintegro desde «Cobros».</div>':'')
    +'<div class="field"><label for="dl-n">Observación (opcional)</label><input type="text" id="dl-n" maxlength="120" placeholder="Ej.: retira el hermano con DNI"></div>',
    buttons:[{label:'Cancelar'},...(op.due>0&&can('payments')?[{label:'Cobrar ahora',cls:'',keep:true,onClick:hh=>{hh.close();payFlow(o.id,()=>deliverFlow(o.id));return false;}}]:[]),{label:'Confirmar entrega',cls:'p',onClick:hh=>{const note=hh.$('#dl-n').value;const r=orderDeliver(id,{note});setTimeout(()=>deliveredModal(o,r),20);}}]});

function otAlerts(o){
  const a=[];const op=orderPay(o);
  if(isLate(o))a.push(['warn','Esta orden está atrasada: lleva '+dur(now()-o.stateSince)+' en «'+ST[o.status].name+'» (límite '+S.cfg.sla[o.status]+' h).']);
  if(o.status==='aprobacion'&&o.quote.validUntil&&o.quote.validUntil<now())a.push(['bad','El presupuesto venció el '+fdate(o.quote.validUntil)+'. Actualizalo y reenvialo.']);
  if(o.quote.status==='borrador'&&!['pendiente','diagnostico'].includes(o.status)&&o.quote.rev>1&&!ST[o.status].terminal)a.push(['warn','El presupuesto tiene cambios sin enviar al cliente.']);
  if(o.quote.lines.some(l=>l.kind==='rep'&&l.state==='reservado'&&stockOf(l.itemId)<l.qty))a.push(['warn','Hay repuestos reservados sin stock físico suficiente. Mirá «Requerimientos».']);
  if(o.status==='listo'&&op.due>0)a.push(['info','Listo para retirar. Saldo a cobrar: '+fmt(op.due)+'.']);
  if(o.status==='listo'&&o.dates.ready&&now()-o.dates.ready>S.cfg.storedDays*DAY)a.push(['warn','Lleva más de '+S.cfg.storedDays+' días sin retirarse.']);
  return a;
}

/* ---------- Diagnóstico y presupuesto ---------- */
const QST={borrador:['Borrador','warn'],enviado:['Enviado al cliente','info'],aprobado:['Aprobado','ok'],rechazado:['Rechazado','bad']};
const LST={cotizado:['Cotizado',''],reservado:['Reservado','info'],usado:['Usado','ok'],liberado:['No usado','']};
function tabPresupuesto(o){
  const q=o.quote,t=quoteTotals(o),closed=ST[o.status].terminal||o.status==='listo';const canQ=(can('orders_work')||can('quote_manage'))&&!closed;const tec=techHidden();
  const cost=can('view_costs');
  const lines=q.lines;
  const diag='<div class="card"><div class="row spread"><h3 style="margin:0">Diagnóstico técnico</h3>'+(can('orders_work')&&!ST[o.status].terminal?'<button type="button" class="btn" data-act="diagEdit" data-id="'+o.id+'">'+ic('edit',16)+'Editar</button>':'')+'</div>'
    +(o.diag.text?'<p style="margin:10px 0 4px">'+esc(o.diag.text)+'</p>'+(o.diag.cause?'<p class="mut sm" style="margin:0">Causa probable: '+esc(o.diag.cause)+'</p>':'')+'<p class="mut xs" style="margin:6px 0 0">'+esc(userName(o.diag.by))+' · '+esc(fdt(o.diag.at))+'</p>':'<p class="mut" style="margin:10px 0 0">Todavía no hay diagnóstico. Hace falta para enviar el presupuesto.</p>')+'</div>';
  const tbl='<div class="tbl-wrap"><table class="tbl"><thead><tr><th scope="col">Detalle</th><th scope="col" class="r">Cant.</th><th scope="col" class="r">Precio</th><th scope="col" class="r">Importe</th><th scope="col">Estado</th>'+(canQ?'<th scope="col"><span class="sr-only">Acciones</span></th>':'')+'</tr></thead><tbody>'
   +(lines.length?lines.map(l=>{const dead=l.state==='liberado';let act='';
      if(l.kind==='rep'&&can('orders_work')&&!dead&&l.state!=='usado'&&['proceso','prueba'].includes(o.status)&&(q.status==='aprobado'||o.type==='garantia'))act+='<button type="button" class="btn xs p" data-act="partUse" data-id="'+o.id+'" data-l="'+l.id+'">Usar</button> <button type="button" class="btn xs" data-act="partRel" data-id="'+o.id+'" data-l="'+l.id+'">No usar</button>';
      return '<tr'+(dead?' style="opacity:.55;text-decoration:line-through"':'')+'><td>'+(l.kind==='mo'?badge('Mano de obra','teal'):badge('Repuesto',''))+' '+esc(l.desc)+(l.kind==='rep'&&l.state==='reservado'&&stockOf(l.itemId)<l.qty?' '+badge('Sin stock','warn'):'')+'</td><td class="r num">'+esc(fq(l.qty))+'</td><td class="r num">'+esc(fmt(l.unitCents))+'</td><td class="r num">'+esc(fmt(lineAmt(l)))+'</td><td>'+(l.kind==='rep'?badge(LST[l.state][0],LST[l.state][1]):'—')+'</td>'+(canQ?'<td class="nowrap">'+act+'</td>':'')+'</tr>';}).join(''):'<tr><td colspan="6"><div class="empty">Todavía no hay renglones. Agregá mano de obra y repuestos del inventario.</div></td></tr>')
   +'</tbody></table></div>';
  const tot='<div class="col" style="gap:4px;margin-top:12px;align-items:flex-end"><div>Mano de obra: <b class="num">'+esc(fmt(t.mo))+'</b></div><div>Repuestos: <b class="num">'+esc(fmt(t.rep))+'</b></div>'+(t.disc?'<div>Bonificación'+(q.discountReason?' ('+esc(q.discountReason)+')':'')+': <b class="num">−'+esc(fmt(t.disc))+'</b></div>':'')+(o.type==='garantia'?'<div class="mut">Reparación por garantía: sin cargo</div>':o.outcome==='cortesia'?'<div class="mut">Sin cargo (cortesía)</div>':'')+'<div style="font-size:1.25rem">Total: <b class="num">'+esc(fmt(t.total))+'</b></div>'+(t.estMin?'<div class="mut sm">Tiempo estimado: '+esc(dur(t.estMin*MIN))+'</div>':'')+(cost&&t.billable?'<div class="mut sm">Costo de repuestos '+esc(fmt(t.cost))+' · margen bruto estimado '+esc(fmt(t.total-t.cost))+'</div>':'')+'</div>';
  const btns=[];
  if(canQ){btns.push('<button type="button" class="btn p" data-act="quoteEdit" data-id="'+o.id+'">'+ic('edit',18)+(lines.length?'Editar presupuesto':'Armar presupuesto')+'</button>');}
  if(can('quote_manage')&&!closed&&o.type!=='garantia'){
    if(['borrador'].includes(q.status)&&lines.some(l=>l.state!=='liberado'))btns.push('<button type="button" class="btn" data-act="quoteSend" data-id="'+o.id+'">'+ic('send',18)+'Marcar como enviado al cliente</button>');
    if(['borrador','enviado'].includes(q.status)&&lines.some(l=>l.state!=='liberado'))btns.push('<button type="button" class="btn ok" data-act="quoteApprove" data-id="'+o.id+'">'+ic('check',18)+'Registrar aprobación</button>');
    if(['borrador','enviado'].includes(q.status)&&o.status!=='pendiente')btns.push('<button type="button" class="btn d" data-act="quoteReject" data-id="'+o.id+'">'+ic('x',18)+'El cliente rechazó</button>');
  }
  btns.push('<button type="button" class="btn" data-act="printQuote" data-id="'+o.id+'">'+ic('print',18)+'Imprimir presupuesto</button>');
  if(!tec)btns.push(waButton(o,'presupuesto','Enviar por WhatsApp'));
  const qh='<div class="card" style="margin-top:16px"><div class="row spread"><h3 style="margin:0">Presupuesto '+(q.rev>1?'(revisión '+q.rev+')':'')+'</h3>'+badge(QST[q.status][0],QST[q.status][1])+'</div>'
    +(q.status==='enviado'&&q.validUntil?'<p class="mut sm" style="margin:6px 0 0">Vigente hasta el '+esc(fdate(q.validUntil))+'</p>':'')+(q.status==='aprobado'?'<p class="mut sm" style="margin:6px 0 0">Aprobado por '+esc(q.approvedBy)+' · '+esc(q.approvedVia)+' · '+esc(fdt(q.approvedAt))+'</p>':'')+(q.status==='rechazado'?'<p class="mut sm" style="margin:6px 0 0">Motivo: '+esc(q.rejectReason||'')+'</p>':'')
    +'<div style="margin-top:12px">'+tbl+'</div>'+tot+'<div class="row" style="margin-top:14px">'+btns.join('')+'</div></div>';
  return diag+qh;
}
ACTS.printQuote=el=>run(()=>printDoc('presupuesto',el.dataset.id));
ACTS.diagEdit=el=>{const o=getOrder(el.dataset.id);modal({title:'Diagnóstico · '+otCode(o),html:fld('Diagnóstico (qué se encontró)','<textarea id="dg-t" rows="5" maxlength="2000">'+esc(o.diag.text)+'</textarea>','Escribilo de forma que el cliente lo entienda.')+fld('Causa probable (opcional)','<input type="text" id="dg-c" maxlength="200" value="'+esc(o.diag.cause)+'">'),buttons:[{label:'Cancelar'},{label:'Guardar',cls:'p',onClick:h=>{diagSave(o.id,{text:h.$('#dg-t').value,cause:h.$('#dg-c').value});toast('Diagnóstico guardado.','ok');}}]});};
ACTS.partUse=el=>run(()=>partUse(el.dataset.id,el.dataset.l),'Repuesto marcado como usado: se descontó del stock.');
ACTS.partRel=el=>confirmBox({title:'Repuesto no utilizado',html:'Se libera la reserva y el repuesto sale del total.',reason:true,ok:'Liberar',onOk:r=>{partRelease(el.dataset.id,el.dataset.l,r);}});
ACTS.quoteSend=el=>{const o=getOrder(el.dataset.id);modal({title:'Enviar presupuesto · '+otCode(o),small:true,html:'<p>Total: <b>'+esc(fmt(quoteTotals(o).total))+'</b>. Queda registrado como enviado; el aviso por WhatsApp lo mandás vos desde el botón.</p>'+fld('Vigencia (días)','<input type="number" id="qs-d" min="1" max="60" step="1" value="'+S.cfg.quoteValidDays+'">'),buttons:[{label:'Cancelar'},{label:'Marcar como enviado',cls:'p',onClick:h=>{quoteSend(o.id,{validDays:Number(h.$('#qs-d').value)});toast('Presupuesto enviado. Esperando aprobación.','ok');}}]});};
ACTS.quoteApprove=el=>{const o=getOrder(el.dataset.id);const c=getClient(o.clientId);modal({title:'Registrar aprobación · '+otCode(o),small:true,html:'<p>Total <b>'+esc(fmt(quoteTotals(o).total))+'</b>. Al aprobar se reservan los repuestos y la orden pasa a «En proceso».</p>'+fld('¿Cómo aprobó el cliente?','<select id="qa-v">'+opts([['presencial','En persona'],['whatsapp','Por WhatsApp'],['telefono','Por teléfono'],['correo','Por correo']],'whatsapp')+'</select>')+fld('Quién aprobó','<input type="text" id="qa-b" maxlength="80" value="'+esc(c?c.name:'')+'">'),buttons:[{label:'Cancelar'},{label:'Aprobar',cls:'p',onClick:h=>{const r=quoteApprove(o.id,{via:h.$('#qa-v').value,by:h.$('#qa-b').value});toast('Presupuesto aprobado.'+(r.short.length?' Faltan repuestos: se generó un requerimiento.':''),r.short.length?'':'ok');}}]});};
ACTS.quoteReject=el=>{const o=getOrder(el.dataset.id);modal({title:'El cliente rechazó · '+otCode(o),small:true,html:'<p>El equipo queda «Listo» para devolver sin reparar.</p>'+fld('Motivo','<input type="text" id="qr-r" maxlength="200" placeholder="Ej.: le conviene comprar uno nuevo">')+'<label class="chk"><input type="checkbox" id="qr-c" checked><span>Cobrar el diagnóstico ('+esc(fmt((S.services.find(s=>s.id==='svc-diag')||{priceCents:$p(10000)}).priceCents))+')</span></label>',buttons:[{label:'Cancelar'},{label:'Confirmar rechazo',cls:'d',onClick:h=>{quoteReject(o.id,{reason:h.$('#qr-r').value,chargeDiag:h.$('#qr-c').checked});toast('Orden cerrada como sin reparar.','ok');}}]});};

/* ---- editor del presupuesto (modal con borrador local, todo o nada al guardar) ---- */
ACTS.quoteEdit=el=>{
  const o=getOrder(el.dataset.id);
  let L=o.quote.lines.filter(l=>l.state!=='liberado').map(l=>({...l}));let disc=o.quote.discountCents||0,discR=o.quote.discountReason||'';
  const used=l=>l.kind==='rep'&&l.state==='usado';
  let h=null;h=modal({title:'Presupuesto · '+otCode(o),wide:true,sticky:true,html:'<div id="qe"></div>',buttons:[{label:'Cancelar'},{label:'Guardar presupuesto',cls:'p',onClick:hh=>{
      sync();const all=[...L,...o.quote.lines.filter(l=>l.state==='liberado')];
      quoteSave(o.id,{lines:all.map(l=>({id:l.id,kind:l.kind,svcId:l.svcId,itemId:l.itemId,desc:l.desc,qty:l.qty,unitCents:l.unitCents,estMin:l.estMin})),discountCents:disc,discountReason:discR});toast('Presupuesto guardado.','ok');}}],
    onOpen:hh=>{h=hh;draw();}});
  function sync(){h.$$('[data-qi]').forEach(r=>{const i=+r.dataset.qi,l=L[i];if(!l||used(l))return;const q=parseQty(r.querySelector('[data-f=qty]').value),p=parseMoney(r.querySelector('[data-f=price]').value);const dsc=r.querySelector('[data-f=desc]').value;if(isNaN(q)||q<=0)throw new VBErr('Renglón '+(i+1)+': la cantidad tiene que ser mayor a cero.');if(isNaN(p)||p<=0&&o.type!=='garantia')throw new VBErr('Renglón '+(i+1)+': escribí el precio.');l.qty=q;l.unitCents=p;l.desc=dsc;});
    if(can('discount')){const dv=h.$('#qe-disc');if(dv){const v=dv.value.trim();const n=v===''?0:parseMoney(v);if(isNaN(n)||n<0)throw new VBErr('La bonificación no es válida.');disc=n;discR=h.$('#qe-dr').value;}}}
  function draw(){
    const tmp={...o,quote:{...o.quote,lines:L,discountCents:disc},type:o.type,outcome:o.outcome};const t=quoteTotals(tmp);
    h.$('#qe').innerHTML='<div class="row" style="margin-bottom:10px"><div class="field grow"><label for="qe-svc">Mano de obra por tipo de servicio</label><select id="qe-svc">'+opts(S.services.filter(s=>s.active!==false).map(s=>[s.id,s.name+' · '+fmt(s.priceCents)]),'','Elegí un servicio…')+'</select></div><div class="field grow"><label for="qe-it">Repuesto del inventario</label><select id="qe-it">'+opts(S.items.filter(i=>!i.archived&&i.kind!=='herramienta'&&(i.kind==='repuesto'||i.kind==='insumo')&&(i.priceCents>0||o.type==='garantia')).sort((a,b)=>a.name.localeCompare(b.name)).map(i=>[i.id,i.name+' · '+fmt(i.priceCents)+' · stock '+fq(availOf(i.id))]),'','Elegí un repuesto…')+'</select></div></div>'
     +'<div class="tbl-wrap"><table class="tbl"><thead><tr><th scope="col">Detalle</th><th scope="col" class="r">Cant.</th><th scope="col" class="r">Precio unit.</th><th scope="col" class="r">Importe</th><th scope="col"><span class="sr-only">Quitar</span></th></tr></thead><tbody>'
     +(L.length?L.map((l,i)=>{const u=used(l);return '<tr data-qi="'+i+'"><td>'+(l.kind==='mo'?badge('Mano de obra','teal'):badge('Repuesto',''))+'<input type="text" data-f="desc" maxlength="120" value="'+esc(l.desc)+'" aria-label="Descripción del renglón '+(i+1)+'"'+(u?' disabled':'')+'></td><td class="r" style="width:92px"><input type="text" inputmode="decimal" data-f="qty" value="'+esc(fq(l.qty))+'" aria-label="Cantidad del renglón '+(i+1)+'"'+(u?' disabled':'')+'></td><td class="r" style="width:140px"><input type="text" inputmode="decimal" data-money data-f="price" value="'+esc(String(l.unitCents/100).replace('.',','))+'" aria-label="Precio unitario del renglón '+(i+1)+'"'+(u?' disabled':'')+'></td><td class="r num">'+esc(fmt(lineAmt(l)))+'</td><td>'+(u?badge('Usado','ok'):'<button type="button" class="btn xs d" data-q="del" data-i="'+i+'" aria-label="Quitar renglón '+(i+1)+'">'+ic('x',14)+'</button>')+'</td></tr>';}).join(''):'<tr><td colspan="5"><div class="empty">Elegí un servicio o un repuesto arriba.</div></td></tr>')+'</tbody></table></div>'
     +(can('discount')?'<div class="row" style="margin-top:12px"><div class="field"><label for="qe-disc">Bonificación ($)</label><input type="text" inputmode="decimal" id="qe-disc" data-money placeholder="Sin bonificación" value="'+(disc?esc(String(disc/100).replace('.',',')):'')+'"></div><div class="field grow"><label for="qe-dr">Motivo de la bonificación</label><input type="text" id="qe-dr" maxlength="120" value="'+esc(discR)+'"></div></div>':'')
     +'<div class="col" style="align-items:flex-end;margin-top:12px"><div>Subtotal '+esc(fmt(t.sub))+(t.disc?' · bonificación −'+esc(fmt(t.disc)):'')+'</div><div style="font-size:1.2rem">Total <b class="num">'+esc(fmt(t.total))+'</b></div>'+(t.estMin?'<div class="mut sm">Tiempo estimado '+esc(dur(t.estMin*MIN))+'</div>':'')+'</div>';
    h.$('#qe-svc').onchange=e=>{const s=S.services.find(x=>x.id===e.target.value);if(!s)return;try{sync();}catch(x){if(!(x instanceof VBErr))throw x;}L.push({id:null,kind:'mo',svcId:s.id,desc:s.name,qty:1,unitCents:s.priceCents,estMin:s.estMin||0,costCents:0});draw();};
    h.$('#qe-it').onchange=e=>{const it=getItem(e.target.value);try{sync();}catch(x){if(!(x instanceof VBErr))throw x;}const ex=L.find(l=>l.kind==='rep'&&l.itemId===it.id&&!used(l));if(ex)ex.qty+=1;else L.push({id:null,kind:'rep',itemId:it.id,desc:it.name,qty:1,unitCents:it.priceCents,costCents:it.costCents,state:'cotizado'});draw();};
    h.$$('[data-q=del]').forEach(b=>b.onclick=()=>{try{sync();}catch(x){if(!(x instanceof VBErr))throw x;}L.splice(+b.dataset.i,1);draw();});
    h.$$('[data-qi] input').forEach(i=>i.addEventListener('change',()=>{try{sync();h.clearErr();draw();}catch(x){if(x instanceof VBErr)h.err(x.message);else throw x;}}));
    const dd=h.$('#qe-disc');if(dd)dd.addEventListener('change',()=>{try{sync();h.clearErr();draw();}catch(x){if(x instanceof VBErr)h.err(x.message);else throw x;}});
  }
};

/* ---------- Trabajo: tareas, cronómetro, pruebas, requerimientos ---------- */
function tabTrabajo(o){
  const closed=ST[o.status].terminal;const run=o.timeLog.find(l=>!l.end);const me=curUser();
  const t=quoteTotals(o);
  const crono='<div class="card"><h3>Cronómetro</h3><div class="row spread"><div><div style="font-size:2rem;font-family:var(--mono,monospace)" data-timer="'+o.id+'" aria-live="off">'+esc(clock(orderMs(o)))+'</div><div class="mut sm">Tiempo total'+(t.estMin?' · estimado '+esc(dur(t.estMin*MIN)):'')+'</div></div><div class="row">'
    +(!closed&&can('orders_work')&&['diagnostico','proceso','prueba'].includes(o.status)?(run&&(me.role!=='tecnico'||run.techId===me.id)?'<button type="button" class="btn d lg" data-act="tmStop" data-id="'+o.id+'">'+ic('pause',20)+'Pausar</button>':'<button type="button" class="btn p lg" data-act="tmStart" data-id="'+o.id+'">'+ic('play',20)+'Iniciar</button>'):'')+'</div></div>'
    +(run?'<p class="sm" style="margin:8px 0 0">Corriendo: '+esc(userName(run.techId))+' desde las '+esc(ftime(run.start))+'</p>':'')
    +(o.timeLog.length?'<details style="margin-top:10px"><summary>Registro de tiempos ('+o.timeLog.length+')</summary><ul style="margin:8px 0 0;padding-left:18px">'+o.timeLog.map(l=>'<li class="sm">'+esc(userName(l.techId))+' · '+esc(fdt(l.start))+' → '+(l.end?esc(ftime(l.end))+' ('+esc(dur(l.end-l.start))+')':'en curso')+'</li>').join('')+'</ul></details>':'')+'</div>';
  const tasks='<div class="card"><div class="row spread"><h3 style="margin:0">Tareas</h3>'+(!closed&&(can('assign')||can('orders_work'))?'<button type="button" class="btn" data-act="taskAdd" data-id="'+o.id+'">'+ic('plus',16)+'Agregar</button>':'')+'</div>'
    +(o.tasks.length?'<div style="margin-top:8px">'+o.tasks.map(k=>'<div class="row" style="flex-wrap:nowrap;border-bottom:1px solid var(--line)"><label class="chk grow"><input type="checkbox" data-chg="taskTog" data-id="'+o.id+'" data-t="'+k.id+'"'+(k.done?' checked':'')+(closed?' disabled':'')+'><span'+(k.done?' style="text-decoration:line-through;color:var(--mut)"':'')+'>'+esc(k.text)+'<br><small class="mut">'+esc(k.techId?userName(k.techId):'Sin asignar')+(k.done?' · terminada '+esc(ago(k.doneAt)):'')+'</small></span></label>'+(!k.done&&can('assign')&&!closed?'<button type="button" class="btn xs g" data-act="taskDel" data-id="'+o.id+'" data-t="'+k.id+'" aria-label="Quitar tarea">'+ic('x',14)+'</button>':'')+'</div>').join('')+'</div>':'<p class="mut" style="margin:10px 0 0">Sin tareas. Agregá los pasos de la reparación y asignalos.</p>')+'</div>';
  const tests='<div class="card"><h3>Pruebas de calidad antes de entregar</h3><p class="mut sm" style="margin:0 0 6px">Se marcan en «En proceso» o «En prueba». Todas deben estar tildadas para pasar a «Listo».</p>'+o.tests.map((x,i)=>'<label class="chk"><input type="checkbox" data-chg="testTog" data-id="'+o.id+'" data-i="'+i+'"'+(x.ok?' checked':'')+(!(['proceso','prueba'].includes(o.status))||!can('orders_work')?' disabled':'')+'><span>'+esc(x.text)+'</span></label>').join('')+'</div>';
  const parts=o.quote.lines.filter(l=>l.kind==='rep'&&l.state!=='liberado');
  const reqs=S.reqs.filter(r=>r.orderId===o.id);
  const rq='<div class="card"><div class="row spread"><h3 style="margin:0">Repuestos y requerimientos</h3>'+(can('request')&&!closed?'<button type="button" class="btn" data-act="reqNew" data-id="'+o.id+'">'+ic('plus',16)+'Pedir algo</button>':'')+'</div>'
    +(parts.length?'<ul style="margin:10px 0 0;padding-left:18px">'+parts.map(l=>'<li>'+esc(fq(l.qty))+' × '+esc(l.desc)+' — '+badge(LST[l.state][0],LST[l.state][1])+(l.state!=='usado'?' <span class="mut sm">stock físico '+esc(fq(stockOf(l.itemId)))+'</span>':'')+'</li>').join('')+'</ul>':'<p class="mut" style="margin:10px 0 0">Esta orden no lleva repuestos.</p>')
    +(reqs.length?'<h4 style="margin:14px 0 6px">Requerimientos de esta orden</h4><ul style="margin:0;padding-left:18px">'+reqs.map(r=>'<li>#'+r.n+' '+esc(r.desc)+' — '+badge({pendiente:'Pendiente',en_pedido:'En pedido',atendido:'Atendido',descartado:'Descartado'}[r.status]||r.status,r.status==='pendiente'?'warn':r.status==='atendido'?'ok':'')+'</li>').join('')+'</ul>':'')+'</div>';
  return '<div class="grid g2"><div class="col" style="gap:16px">'+crono+tasks+'</div><div class="col" style="gap:16px">'+tests+rq+'</div></div>';
}
ACTS.tmStart=el=>run(()=>timerStart(el.dataset.id),'Cronómetro en marcha.');
ACTS.tmStop=el=>run(()=>timerStop(el.dataset.id),'Cronómetro pausado.');
ACTS.taskAdd=el=>{const o=getOrder(el.dataset.id);const mine=curUser().role==='tecnico';modal({title:'Nueva tarea · '+otCode(o),small:true,html:fld('Tarea','<input type="text" id="tk-t" maxlength="120" placeholder="Ej.: Cambiar pasta térmica y limpiar coolers">')+(mine?'':fld('Técnico asignado','<select id="tk-u">'+opts(techs().map(t=>[t.id,t.name]),o.techId,'Sin asignar')+'</select>')),buttons:[{label:'Cancelar'},{label:'Agregar',cls:'p',onClick:h=>{taskAdd(o.id,{text:h.$('#tk-t').value,techId:mine?SESSION.uid:(h.$('#tk-u').value||null)});}}]});};
ACTS.taskDel=el=>run(()=>taskRemove(el.dataset.id,el.dataset.t));

    +(!openSession()&&canPay?'<div class="alert warn" style="margin-top:12px">'+ic('alert',18)+'La caja está cerrada. <a href="#panel/caja">Abrila</a> para poder cobrar.</div>':'')
    +(op.due<0?'<div class="alert warn" style="margin-top:12px">Hay un saldo a favor del cliente de '+esc(fmt(-op.due))+': corresponde un reintegro.</div>':'')+'</div>';
  const list='<div class="card" style="margin-top:16px"><h3>Pagos registrados</h3>'+(pays.length?'<div class="tbl-wrap"><table class="tbl"><thead><tr><th scope="col">Fecha</th><th scope="col">Medios</th><th scope="col" class="r">Importe</th><th scope="col">Estado</th><th scope="col"><span class="sr-only">Acciones</span></th></tr></thead><tbody>'+pays.map(p=>'<tr><td class="nowrap">'+esc(fdt(p.ts))+'<br><small class="mut">'+esc(userName(p.uid))+'</small></td><td>'+p.lines.map(l=>esc(METHODS[l.m])+' '+esc(fmt(l.a))+(l.ref?' <small class="mut">('+esc(l.ref)+')</small>':'')+(l.m==='efectivo'&&l.change?' <small class="mut">vuelto '+esc(fmt(l.change))+'</small>':'')).join('<br>')+'</td><td class="r num">'+esc(fmt(p.amountCents))+'</td><td>'+(p.lines.some(l=>!l.verified)?badge('Falta verificar','warn'):badge('Acreditado','ok'))+'</td><td class="nowrap">'+(p.lines.some(l=>!l.verified)&&can('verify_pay')?'<button type="button" class="btn xs p" data-act="payVerify" data-id="'+p.id+'">Verificar</button> ':'')+(can('void_pay')&&!p.refund&&o.status!=='entregado'?'<button type="button" class="btn xs d" data-act="payVoid" data-id="'+p.id+'">Anular</button>':'')+'</td></tr>').join('')+'</tbody></table></div>':'<p class="mut" style="margin:6px 0 0">Todavía no hay pagos.</p>')+'</div>';
  const ec=can('view_costs')?(()=>{const e=orderEconomics(o);return '<div class="card" style="margin-top:16px"><h3>Historial financiero de la reparación</h3>'+kv('Mano de obra',esc(fmt(e.moRev)))+kv('Repuestos vendidos',esc(fmt(e.repRev)))+(e.disc?kv('Bonificación','−'+esc(fmt(e.disc))):'')+kv('Ingreso total',esc(fmt(e.rev)))+kv('Costo de repuestos usados',esc(fmt(e.cost)))+kv('Margen bruto estimado','<b>'+esc(fmt(e.margin))+'</b>')+kv('Horas trabajadas',esc(dur(orderMs(o))))+'<p class="mut xs" style="margin:8px 0 0">Margen bruto = ingreso − costo de repuestos. No descuenta sueldos ni gastos fijos.</p></div>';})():'';
  return head+list+ec;
}

/* =====================================================================
   COBROS Y CAJA: modal de pago mixto (compartido), pantalla de caja
   (apertura, ingresos/egresos con rubro, arqueo, cierre sellado) y
   venta de mostrador.
   ===================================================================== */
const moneyIn=v=>{v=String(v==null?'':v).trim();if(v==='')return 0;const n=parseMoney(v);return isNaN(n)?NaN:n;};
const moneyVal=c=>c?String(c/100).replace('.',','):'';

/* payModal: título, importe a cobrar, cliente (para cuenta corriente), allowCc, onSubmit(lines,key) → crea el cobro */
function payModal({title,amount,client,allowCc,note,onSubmit,onDone}){
  const key=nid('k');const methods=Object.keys(METHODS).filter(m=>m!=='cc'||(allowCc&&client&&!client.anon&&client.ccLimitCents>0));
  const sess=openSession();
  let h=null;h=modal({title,sticky:true,html:'<div id="pm"></div>',buttons:[{label:'Cancelar'},{label:'Confirmar cobro',cls:'p',onClick:hh=>{const st=state();if(!st.chk.ok)throw new VBErr(st.chk.msg||'Revisá los importes.');
      const p=onSubmit(st.lines,key);toast('Cobro registrado.','ok');if(onDone)setTimeout(()=>onDone(p),20);}}],onOpen:hh=>{h=hh;draw();}});
  const sel={};let eres={};
  function state(){
    const lines=[];let bad=false;
    for(const m of methods){const on=h.$('[data-pm="'+m+'"]');if(!on||!on.checked)continue;const a=moneyIn(h.$('[data-pa="'+m+'"]').value);const l={m,a};if(isNaN(a))bad=true;
      if(m==='efectivo'){const r=h.$('[data-pr="efectivo"]');if(r&&r.value.trim()!==''){const rv=parseMoney(r.value);if(isNaN(rv))bad=true;else l.recibido=rv;}}
      if(DIGITAL.includes(m)||m==='debito'||m==='credito'){const rf=h.$('[data-pf="'+m+'"]');if(rf&&rf.value.trim())l.ref=rf.value.trim();}
      lines.push(l);}
    const chk=bad?{ok:false,msg:'Revisá los importes: hay un número que no se entiende.',diff:amount,sum:0,cc:0,change:0}:payCheck(amount,lines.map(l=>({...l})),client);
    return {lines,chk};
  }
  function draw(){
    const prev={};if(h.$('#pm').children.length){for(const m of methods){const on=h.$('[data-pm="'+m+'"]');if(on)prev[m]={on:on.checked,a:h.$('[data-pa="'+m+'"]').value,r:(h.$('[data-pr="'+m+'"]')||{}).value,f:(h.$('[data-pf="'+m+'"]')||{}).value};}}
    h.$('#pm').innerHTML='<div class="row spread" style="margin-bottom:8px"><div><div class="mut sm">Importe a cobrar</div><div style="font-size:1.8rem" class="num"><b>'+esc(fmt(amount))+'</b></div></div>'+(note?'<div class="mut sm" style="max-width:55%;text-align:right">'+esc(note)+'</div>':'')+'</div>'
     +(!sess?'<div class="alert bad">'+ic('alert',18)+'La caja está cerrada. Abrila antes de cobrar.</div>':'')
     +'<div class="col" style="gap:10px">'+methods.map(m=>{const p=prev[m]||{on:false,a:'',r:'',f:''};
       return '<div class="card flat" style="padding:10px"><div class="row" style="flex-wrap:nowrap"><label class="chk" style="min-width:190px"><input type="checkbox" data-pm="'+m+'"'+(p.on?' checked':'')+'><span><b>'+esc(METHODS[m])+'</b></span></label>'
        +'<div class="field grow" style="min-width:120px"><label class="sr-only" for="pa-'+m+'">Importe en '+esc(METHODS[m])+'</label><input type="text" inputmode="decimal" data-money id="pa-'+m+'" data-pa="'+m+'" placeholder="Importe" value="'+esc(p.a)+'" '+(p.on?'':'disabled')+'></div>'
        +'<button type="button" class="btn xs" data-resto="'+m+'" '+(p.on?'':'disabled')+'>Resto</button></div>'
        +(m==='efectivo'&&p.on?'<div class="row" style="margin-top:6px"><div class="field"><label for="pr-e">Efectivo recibido (para el vuelto)</label><input type="text" inputmode="decimal" data-money id="pr-e" data-pr="efectivo" placeholder="Opcional" value="'+esc(p.r||'')+'"></div></div>':'')
        +(m!=='efectivo'&&m!=='cc'&&p.on?'<div class="row" style="margin-top:6px"><div class="field grow"><label for="pf-'+m+'">'+(DIGITAL.includes(m)?'N.º de operación / comprobante':'Últimos 4 / cupón')+' (opcional)</label><input type="text" id="pf-'+m+'" data-pf="'+m+'" maxlength="40" value="'+esc(p.f||'')+'"></div></div>':'')
        +(m==='cc'&&p.on?'<p class="mut sm" style="margin:6px 0 0">Disponible: '+esc(fmt(Math.max(0,client.ccLimitCents-ccBalance(client.id))))+' (límite '+esc(fmt(client.ccLimitCents))+'). Queda como deuda del cliente.</p>':'')
        +(DIGITAL.includes(m)&&p.on?'<p class="mut sm" style="margin:6px 0 0">Queda «pendiente de verificar» hasta confirmar la acreditación; hasta entonces no se puede entregar el equipo.</p>':'')+'</div>';}).join('')+'</div><div id="pm-sum" aria-live="polite" style="margin-top:12px"></div>';
    h.$$('[data-pm]').forEach(c=>c.onchange=()=>{draw();});
    h.$$('[data-resto]').forEach(b=>b.onclick=()=>{const m=b.dataset.resto;const others=sum(methods.filter(x=>x!==m),x=>{const e=h.$('[data-pa="'+x+'"]');const c=e&&!e.disabled?moneyIn(e.value):0;return isNaN(c)?0:c;});const falta=Math.max(0,amount-others);h.$('[data-pa="'+m+'"]').value=moneyVal(falta);refresh();});
    h.$$('[data-pa],[data-pr],[data-pf]').forEach(i=>i.addEventListener('input',refresh));
    refresh();
  }
  function refresh(){
    const st=state(),c=st.chk;const box=h.$('#pm-sum');if(!box)return;
    let html='';
    if(!st.lines.length)html='<div class="alert info">Elegí cómo paga el cliente. Podés combinar medios (por ejemplo, efectivo + transferencia).</div>';
    else if(c.ok)html='<div class="alert ok" role="status">'+ic('check',18)+'<span>Los importes cierran. '+(c.change?'<b>Vuelto: '+esc(fmt(c.change))+'</b>':'')+(c.cc?' A cuenta corriente: '+esc(fmt(c.cc))+'.':'')+'</span></div>';
    else html='<div class="alert warn" role="status">'+ic('alert',18)+'<span>'+esc(c.msg||'Revisá los importes.')+'</span></div>';
    const ef=st.lines.find(l=>l.m==='efectivo');
    if(ef&&ef.recibido!=null&&c.ok&&c.change>0)html+='<div class="alert info" role="status">Controlá el vuelto antes de confirmar: recibido '+esc(fmt(ef.recibido))+' − cobrado '+esc(fmt(ef.a))+' = <b>'+esc(fmt(c.change))+'</b>.</div>';
    box.innerHTML=html;h.setBtn(1,{disabled:!c.ok||!sess});
  }
  return h;
}
function payFlow(orderId,after){
  const o=getOrder(orderId);const op=orderPay(o);const c=getClient(o.clientId);
  if(!openSession()){toast('La caja está cerrada. Abrila para poder cobrar.','bad');location.hash='#panel/caja';return;}
  payModal({title:'Cobrar '+otCode(o),amount:op.due,client:c,allowCc:true,note:devLabel(orderDev(o))+' · '+clientName(o.clientId)+(op.paid?' · ya cobrado '+fmt(op.paid):''),
    onSubmit:(lines,key)=>paymentCreate({kind:'orden',refId:o.id,lines,amountCents:op.due,key}),onDone:()=>{if(after)after();}});
}

UI.f.caja={sel:null};
const RUBRO_TYPES={ingreso:'Ingreso',egreso:'Egreso',ambos:'Ambos'};
function cashMoveRows(sess){
  const mv=S.cash.moves.filter(m=>m.sessionId===sess.id).sort((a,b)=>b.ts-a.ts);
  const TL={cobro:'Cobro',ingreso:'Ingreso',egreso:'Egreso',reintegro:'Reintegro',anulacion:'Anulación'};
  const acc={ts:m=>m.ts,tp:m=>TL[m.type],me:m=>METHODS[m.method],ru:m=>(S.rubros.find(r=>r.id===m.rubroId)||{}).name,de:m=>m.desc,im:m=>m.amountCents};
  const rows=sortRows('cmv',mv,acc,{key:'ts',dir:'desc'});
  return tableWrap('<table class="tbl"><thead><tr>'+sortHead('cmv','ts','Hora')+sortHead('cmv','tp','Tipo')+sortHead('cmv','me','Medio','hide-sm')+sortHead('cmv','ru','Rubro','hide-sm')+sortHead('cmv','de','Detalle')+sortHead('cmv','im','Importe','r')+'</tr></thead><tbody>'
   +(rows.length?rows.map(m=>'<tr><td class="nowrap">'+esc(ftime(m.ts))+'</td><td>'+esc(TL[m.type])+'</td><td class="hide-sm">'+esc(METHODS[m.method])+'</td><td class="hide-sm">'+esc((S.rubros.find(r=>r.id===m.rubroId)||{}).name||'—')+'</td><td>'+esc(m.desc||'')+'</td><td class="r num" style="color:'+(m.amountCents<0?'var(--bad,#b91c1c)':'inherit')+'">'+esc(fmt(m.amountCents))+'</td></tr>').join(''):'<tr><td colspan="6"><div class="empty">Sin movimientos todavía.</div></td></tr>')+'</tbody></table>');
}
function cashOpenView(sess){
  const ar=arqueoCalc(sess);const pend=S.payments.filter(p=>!p.voidedAt&&p.lines.some(l=>!l.verified));
  const tiles='<div class="bento"><div class="card kpi"><div class="mut sm">Fondo inicial</div><div class="big num">'+esc(fmt(ar.fondo))+'</div></div><div class="card kpi"><div class="mut sm">Cobrado en la caja (todos los medios)</div><div class="big num">'+esc(fmt(ar.cobradoReal))+'</div></div><div class="card kpi"><div class="mut sm">Efectivo que debería haber</div><div class="big num">'+esc(fmt(ar.efectivoEsperado))+'</div><div class="mut xs">Fondo + cobros en efectivo + ingresos − egresos − reintegros</div></div><div class="card kpi"><div class="mut sm">Cobros digitales sin verificar</div><div class="big num">'+esc(fmt(ar.pendienteDigital))+'</div></div></div>';
  const medios='<div class="card"><h3>Por medio de pago</h3>'+Object.entries(ar.porMedio).map(([k,v])=>kv(METHODS[k],'<span class="num">'+esc(fmt(v))+'</span>')).join('')+kv('Ingresos manuales','<span class="num">'+esc(fmt(ar.ingresos))+'</span>')+kv('Egresos','<span class="num">'+esc(fmt(ar.egresos))+'</span>')+(ar.ccNuevo?kv('Vendido a cuenta corriente (no es efectivo)','<span class="num">'+esc(fmt(ar.ccNuevo))+'</span>'):'')+'</div>';
  const mover=can('cash')?'<div class="card"><h3>Ingreso o egreso de efectivo</h3><div class="grid g2"><div class="field"><label for="cm-t">Tipo</label><select id="cm-t" data-chg="cmType"><option value="egreso">Egreso (sale plata)</option><option value="ingreso">Ingreso (entra plata)</option></select></div><div class="field"><label for="cm-r">Rubro (obligatorio)</label><select id="cm-r">'+cmRubros('egreso')+'</select></div><div class="field"><label for="cm-a">Importe ($)</label><input type="text" inputmode="decimal" data-money id="cm-a" placeholder="Importe"></div><div class="field"><label for="cm-d">Detalle</label><input type="text" id="cm-d" maxlength="120" placeholder="Ej.: Compra de insumos de limpieza"></div></div><div class="row" style="margin-top:10px"><button type="button" class="btn p" data-act="cmAdd">Registrar movimiento</button></div></div>':'';
  const verif=pend.length&&can('verify_pay')?'<div class="card"><h3>Cobros digitales por verificar</h3>'+pend.map(p=>'<div class="row spread" style="border-bottom:1px solid var(--line);padding:6px 0"><span>'+esc(fdt(p.ts))+' · '+esc(p.lines.filter(l=>!l.verified).map(l=>METHODS[l.m]+' '+fmt(l.a)).join(', '))+'<br><small class="mut">'+esc(p.kind==='orden'?otCode(getOrder(p.refId)):'Venta de mostrador')+'</small></span><button type="button" class="btn xs p" data-act="payVerify" data-id="'+p.id+'">Verificar</button></div>').join('')+'</div>':'';
  const cierre=can('cash_close')?'<div class="card"><h3>Cerrar la caja</h3><p class="mut sm">Contá el efectivo del cajón y escribilo. Si no coincide con lo esperado, explicá el motivo. Al cerrar, el resumen queda sellado y no se puede modificar.</p><div class="grid g2"><div class="field"><label for="cc-d">Efectivo contado ($)</label><input type="text" inputmode="decimal" data-money id="cc-d" placeholder="Lo que contaste" data-inp="ccDiff"></div><div class="field"><label for="cc-n">Observaciones</label><input type="text" id="cc-n" maxlength="300"></div></div><div id="cc-sum" style="margin-top:10px"></div><div class="row" style="margin-top:10px"><button type="button" class="btn d" data-act="ccClose">Cerrar caja…</button></div></div>':'';
  return '<div class="alert ok" style="margin-bottom:14px">'+ic('check',18)+'Caja #'+sess.n+' abierta desde el '+esc(fdt(sess.openedAt))+' por '+esc(userName(sess.openedBy))+'.</div>'+tiles+'<div class="grid g2" style="margin-top:16px"><div class="col" style="gap:16px">'+medios+mover+'</div><div class="col" style="gap:16px">'+verif+cierre+'</div></div><div class="card" style="margin-top:16px"><h3>Movimientos de esta caja</h3>'+region('cmv',()=>cashMoveRows(sess))+'</div>';
}
function cmRubros(type){return opts(S.rubros.filter(r=>!r.sys&&(r.type==='ambos'||r.type===type)).map(r=>[r.id,r.name]),'','Elegí un rubro…');}
CHG.cmType=el=>{$('#cm-r').innerHTML=cmRubros(el.value);};
ACTS.cmAdd=()=>{const a=parseMoney($('#cm-a').value);if(isNaN(a)||a<=0){toast('Escribí un importe mayor a cero.','bad');return;}run(()=>{cashMove({type:$('#cm-t').value,amountCents:a,rubroId:$('#cm-r').value,desc:$('#cm-d').value});},'Movimiento registrado.');};
INP.ccDiff=()=>{const s=openSession();const b=$('#cc-sum');if(!s||!b)return;const v=parseMoney($('#cc-d').value);if(isNaN(v)){b.innerHTML='';return;}const ar=arqueoCalc(s);const d=v-ar.efectivoEsperado;b.innerHTML=d===0?'<div class="alert ok">Coincide con lo esperado ('+esc(fmt(ar.efectivoEsperado))+').</div>':'<div class="alert warn">Esperado '+esc(fmt(ar.efectivoEsperado))+' · contado '+esc(fmt(v))+' · diferencia <b>'+esc(fmt(d))+'</b>. Tenés que explicar el motivo.</div>';};
ACTS.ccClose=()=>{const v=parseMoney($('#cc-d').value);if(isNaN(v)){toast('Escribí el efectivo contado.','bad');return;}const s=openSession();const ar=arqueoCalc(s);
  confirmBox({title:'Cerrar la caja #'+s.n,html:'<p>Esperado en efectivo: <b>'+esc(fmt(ar.efectivoEsperado))+'</b><br>Contado: <b>'+esc(fmt(v))+'</b><br>Diferencia: <b>'+esc(fmt(v-ar.efectivoEsperado))+'</b></p>'+(ar.pendienteDigital?'<div class="alert warn">Hay '+esc(fmt(ar.pendienteDigital))+' de cobros digitales sin verificar.</div>':'')+'<p>El cierre queda sellado y no se puede modificar.</p>',ok:'Cerrar caja',danger:true,onOk:()=>{const ses=cashClose({declaredCents:v,notes:$('#cc-n')?$('#cc-n').value:''});toast('Caja cerrada y sellada.','ok');setTimeout(()=>{UI.f.caja.sel=ses.id;renderView();},30);}});};
function cashClosedView(){
  const cl=S.cash.sessions.filter(s=>s.status==='cerrada').sort((a,b)=>b.closedAt-a.closedAt);

ACTS.recNew=el=>{
  const po=el&&el.dataset&&el.dataset.po?S.pos.find(p=>p.id===el.dataset.po):null;const key=nid('k');
  let L=po?po.lines.map(l=>({itemId:l.itemId,qty:l.qty,costCents:l.costCents})):[];let supId=po?po.supplierId:'';
  const today=new Date(now()).toLocaleDateString('sv-SE',{timeZone:'America/Argentina/Salta'});
  let h=null;h=modal({title:po?'Recibir '+poCode(po):'Recibir mercadería',wide:true,sticky:true,html:'<div id="rc"></div>',onOpen:hh=>{h=hh;draw();},buttons:[{label:'Cancelar'},{label:'Confirmar recepción',cls:'p',onClick:hh=>{sync();const tot=sum(L,l=>Math.round(l.qty*l.costCents));const dt=parseDateInput(hh.$('#rc-f').value);if(isNaN(dt))throw new VBErr('La fecha del comprobante no es válida.');const dec=parseMoney(hh.$('#rc-t').value);if(isNaN(dec))throw new VBErr('Escribí el total del comprobante.');
      const cond=hh.$('#rc-cd').value;receiptCreate({key,supplierId:supId,poId:po?po.id:null,docType:hh.$('#rc-dt').value,docNo:hh.$('#rc-n').value,date:dt,lines:L,declaredTotalCents:dec,condition:cond,method:cond==='contado'?hh.$('#rc-m').value:null,rubroId:cond==='contado'?hh.$('#rc-r').value:null});toast('Mercadería recibida: stock y deuda actualizados.','ok');UI.tab.cmp='recepciones';}}]});
  function sync(){h.$$('[data-ri]').forEach(r=>{const l=L[+r.dataset.ri];const q=parseQty(r.querySelector('[data-f=q]').value),c=parseMoney(r.querySelector('[data-f=c]').value);if(isNaN(q)||q<=0)throw new VBErr('Cantidad inválida en el renglón '+(+r.dataset.ri+1)+'.');if(isNaN(c)||c<0)throw new VBErr('Costo inválido en el renglón '+(+r.dataset.ri+1)+'.');l.qty=q;l.costCents=c;});const s=h.$('#rc-s');if(s&&!po)supId=s.value;}
  function draw(){
    const keep={dt:(h.$('#rc-dt')||{}).value,n:(h.$('#rc-n')||{}).value,f:(h.$('#rc-f')||{}).value,t:(h.$('#rc-t')||{}).value,cd:(h.$('#rc-cd')||{}).value,m:(h.$('#rc-m')||{}).value,r:(h.$('#rc-r')||{}).value};
    const tot=sum(L,l=>Math.round(l.qty*l.costCents));const items=S.items.filter(i=>!i.archived&&i.kind!=='herramienta'&&(!po||po.lines.some(l=>l.itemId===i.id))).sort((a,b)=>a.name.localeCompare(b.name));
    h.$('#rc').innerHTML='<div class="grid g2">'+(po?fld('Proveedor','<input type="text" disabled value="'+esc(getSup(supId).name)+'">'):fld('Proveedor','<select id="rc-s">'+opts(S.suppliers.filter(s=>s.active!==false).map(s=>[s.id,s.name]),supId,'Elegí un proveedor…')+'</select>'))
     +fld('Tipo de comprobante','<select id="rc-dt">'+opts([['Factura','Factura'],['Remito','Remito']],keep.dt||'Factura')+'</select>')+fld('N.º de comprobante','<input type="text" id="rc-n" maxlength="30" placeholder="Ej.: 0001-00012345" value="'+esc(keep.n||'')+'">')+fld('Fecha del comprobante','<input type="date" id="rc-f" value="'+esc(keep.f||today)+'">')+'</div>'
     +'<div class="row" style="margin:10px 0"><div class="field grow"><label for="rc-add">Agregar artículo recibido</label><select id="rc-add">'+opts(items.map(i=>[i.id,i.name+' · stock '+fq(stockOf(i.id))]),'','Elegí un artículo…')+'</select></div></div>'
     +tableWrap('<table class="tbl"><thead><tr><th scope="col">Artículo</th><th scope="col" class="r">Cant.</th><th scope="col" class="r">Costo unit.</th><th scope="col" class="r">Importe</th><th scope="col"><span class="sr-only">Quitar</span></th></tr></thead><tbody>'+(L.length?L.map((l,i)=>'<tr data-ri="'+i+'"><td>'+esc(getItem(l.itemId).name)+'<br><small class="mut">costo actual '+esc(fmt(getItem(l.itemId).costCents))+'</small></td><td class="r" style="width:90px"><input type="text" inputmode="decimal" data-f="q" value="'+esc(fq(l.qty))+'" aria-label="Cantidad renglón '+(i+1)+'"></td><td class="r" style="width:130px"><input type="text" inputmode="decimal" data-money data-f="c" value="'+esc(moneyVal(l.costCents))+'" aria-label="Costo renglón '+(i+1)+'"></td><td class="r num">'+esc(fmt(Math.round(l.qty*l.costCents)))+'</td><td><button type="button" class="btn xs d" data-rd="'+i+'" aria-label="Quitar renglón '+(i+1)+'">'+ic('x',14)+'</button></td></tr>').join(''):'<tr><td colspan="5"><div class="empty">Agregá lo que llegó.</div></td></tr>')+'</tbody></table>')
     +'<div class="grid g2" style="margin-top:12px">'+fld('Total del comprobante ($)','<input type="text" inputmode="decimal" data-money id="rc-t" placeholder="Debe coincidir con la suma" value="'+esc(keep.t||'')+'">','Suma de renglones: <b>'+esc(fmt(tot))+'</b>')+fld('Condición','<select id="rc-cd">'+opts([['cc','A cuenta corriente (queda como deuda)'],['contado','Pagado al contado']],keep.cd||'cc')+'</select>')+'</div>'
     +((keep.cd==='contado')?'<div class="grid g2">'+fld('Medio de pago','<select id="rc-m">'+opts([['efectivo','Efectivo (sale de la caja)'],['transferencia','Transferencia'],['debito','Tarjeta débito'],['credito','Tarjeta crédito']],keep.m||'efectivo')+'</select>')+fld('Rubro de egreso','<select id="rc-r">'+opts(S.rubros.filter(r=>!r.sys&&(r.type==='egreso'||r.type==='ambos')).map(r=>[r.id,r.name]),keep.r,'Elegí un rubro…')+'</select>')+'</div>':'');
    const s=h.$('#rc-s');if(s)s.onchange=()=>{supId=s.value;};
    h.$('#rc-add').onchange=e=>{try{sync();}catch(x){if(!(x instanceof VBErr))throw x;}const it=getItem(e.target.value);const ex=L.find(l=>l.itemId===it.id);if(ex)ex.qty+=1;else L.push({itemId:it.id,qty:1,costCents:it.costCents});draw();};
    h.$$('[data-rd]').forEach(b=>b.onclick=()=>{try{sync();}catch(x){if(!(x instanceof VBErr))throw x;}L.splice(+b.dataset.rd,1);draw();});
    h.$$('[data-ri] input').forEach(i=>i.addEventListener('change',()=>{try{sync();h.clearErr();draw();}catch(x){if(x instanceof VBErr)h.err(x.message);else throw x;}}));
    h.$('#rc-cd').onchange=()=>{try{sync();}catch(x){if(!(x instanceof VBErr))throw x;}draw();};
  }
};

SCREENS.equipo={title:'Equipo técnico',perm:'assign',view(){
  const ts=techs();const act=S.orders.filter(o=>!ST[o.status].terminal);const free=act.filter(o=>!o.techId);
  const card=t=>{const mine=act.filter(o=>o.techId===t.id);const run=runningTimer(t.id);const tasks=mine.flatMap(o=>o.tasks.filter(k=>!k.done&&k.techId===t.id).map(k=>({o,k})));const loans=S.loans.filter(l=>l.techId===t.id&&!l.returnedAt);
    const hrs=sum(S.orders,o=>sum(o.timeLog.filter(l=>l.techId===t.id&&l.start>=startOfDay(now())-6*DAY),l=>(l.end||now())-l.start));
    return '<div class="card"><div class="row spread"><div class="row"><span class="ava" aria-hidden="true">'+esc(initials(t.name))+'</span><div><b>'+esc(t.name)+'</b><br><small class="mut">'+mine.length+' orden'+(mine.length===1?'':'es')+' abiertas · '+tasks.length+' tarea'+(tasks.length===1?'':'s')+' pendientes</small></div></div>'+(run?'<span class="badge teal">'+ic('play',10)+' '+esc(otCode(run.order))+' <span data-timer="'+run.order.id+'" data-tech="'+t.id+'">'+clock(orderMs(run.order,t.id))+'</span></span>':'<span class="badge">Sin cronómetro</span>')+'</div>'
     +'<div class="stepper" style="margin:10px 0" aria-label="Órdenes por estado">'+['pendiente','diagnostico','aprobacion','proceso','prueba','listo'].map(k=>{const n=mine.filter(o=>o.status===k).length;return '<span class="s" title="'+esc(ST[k].name)+'">'+esc(ST[k].name.split(' ')[0])+' <b>'+n+'</b></span>';}).join('')+'</div>'
     +(mine.length?'<ul style="margin:0;padding-left:18px">'+mine.slice(0,6).map(o=>'<li><a href="#panel/orden/'+o.id+'">'+esc(otCode(o))+'</a> '+esc(devLabel(orderDev(o)))+' '+stBadge(o.status)+(isLate(o)?' '+badge('Atrasada','bad'):'')+'</li>').join('')+(mine.length>6?'<li class="mut">y '+(mine.length-6)+' más…</li>':'')+'</ul>':'<p class="mut" style="margin:0">Sin órdenes asignadas.</p>')

/* =====================================================================
   CONFIGURACIÓN (taller, servicios, rubros financieros, usuarios,
   avisos, fidelidad, copia de seguridad) y AUDITORÍA con cadena hash.
   Las reglas viven en funciones cfg*: validan permiso antes de tocar nada.
   ===================================================================== */
const posInt=(v,min,max,label)=>{const n=Math.round(Number(String(v).replace(',','.')));if(!isFinite(n)||n<min||n>max)fail(label+' tiene que ser un número entre '+min+' y '+max+'.');return n;};
function cfgShop(d){
  need('config');const s=S.cfg.shop;
  const name=txt(d.name,2,60,'El nombre del taller');
  const mail=String(d.mail||'').trim();if(mail&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail))fail('El correo del taller no es válido.');
  const rate=Math.round(d.rateHourCents);if(!isFinite(rate)||rate<=0)fail('El valor de la hora de trabajo tiene que ser mayor a cero.');
  const w=posInt(d.warrantyDays,0,365,'La garantía'),q=posInt(d.quoteValidDays,1,60,'La vigencia del presupuesto'),sd=posInt(d.storedDays,1,365,'Los días de guarda'),cm=posInt(d.commissionPct,0,100,'La comisión');
  Object.assign(s,{name,legal:String(d.legal||'').slice(0,80),cuit:String(d.cuit||'').slice(0,20),addr:String(d.addr||'').slice(0,100),wa:String(d.wa||'').slice(0,25),phone:String(d.phone||'').slice(0,25),mail,hours:String(d.hours||'').slice(0,120),fiscal:String(d.fiscal||'').slice(0,60)});
  Object.assign(S.cfg,{rateHourCents:rate,warrantyDays:w,quoteValidDays:q,storedDays:sd,commissionPct:cm});
  const terms=String(d.terms||'').trim();if(terms.length<20)fail('Los términos y condiciones son muy cortos.');S.cfg.terms=terms.slice(0,3000);S.cfg.termsConfirmed=!!d.termsConfirmed;
  audit('CONFIG_TALLER',name);emitChange();
}
function serviceSave(d){
  need('config');const name=txt(d.name,3,60,'El nombre del servicio');const price=Math.round(d.priceCents);if(!isFinite(price)||price<=0)fail('El precio del servicio tiene que ser mayor a cero.');
  const est=posInt(d.estMin,5,2400,'El tiempo estimado'),wd=posInt(d.warrantyDays,0,365,'La garantía');
  if(S.services.some(s=>s.id!==d.id&&s.name.toLowerCase()===name.toLowerCase()))fail('Ya existe un servicio con ese nombre.');
  if(d.id){const s=S.services.find(x=>x.id===d.id);if(!s)fail('El servicio no existe.');Object.assign(s,{name,priceCents:price,estMin:est,warrantyDays:wd,active:d.active!==false});}
  else S.services.push({id:nid('sv'),name,priceCents:price,estMin:est,warrantyDays:wd,active:true});
  audit('SERVICIO_GUARDADO',name+' '+fmt(price));emitChange();
}
function rubroSave(d){
  need('config');const name=txt(d.name,3,50,'El nombre del rubro');if(!RUBRO_TYPES[d.type])fail('Elegí si es de ingreso, egreso o ambos.');
  if(S.rubros.some(r=>r.id!==d.id&&r.name.toLowerCase()===name.toLowerCase()))fail('Ya existe un rubro con ese nombre.');
  if(d.id){const r=S.rubros.find(x=>x.id===d.id);if(!r||r.sys)fail('Ese rubro lo usa el sistema y no se modifica.');Object.assign(r,{name,type:d.type});}else S.rubros.push({id:nid('rb'),name,type:d.type,sys:false});
  audit('RUBRO_GUARDADO',name);emitChange();
}
function userSave(d){
  need('config');const name=txt(d.name,3,60,'El nombre');if(!ROLES[d.role])fail('Elegí un rol.');
  const cm=d.commissionPct===''||d.commissionPct==null?null:posInt(d.commissionPct,0,100,'La comisión');
  if(d.id){const u=userById(d.id);if(!u)fail('El usuario no existe.');
    const activeAdmins=S.users.filter(x=>x.role==='admin'&&x.active!==false&&x.id!==u.id).length;if(u.role==='admin'&&(d.role!=='admin'||d.active===false)&&activeAdmins===0)fail('Tiene que quedar al menos un administrador activo.');
    Object.assign(u,{name,role:d.role,active:d.active!==false,commissionPct:d.role==='tecnico'?cm:null});}
  else S.users.push({id:nid('u'),name,role:d.role,active:true,commissionPct:d.role==='tecnico'?cm:null});
  audit('USUARIO_GUARDADO',name+' ('+d.role+')');emitChange();
}

/* ---- copia de seguridad ---- */
function backupJson(){need('config');const copy=JSON.parse(JSON.stringify(S));return JSON.stringify({app:'clinica-pc',build:APP.build,exportedAt:now(),state:copy});}
function backupRestore(text){
  need('config');let o;try{o=JSON.parse(text);}catch(e){fail('El archivo no es una copia de seguridad válida (no se puede leer).');}
  if(!o||o.app!=='clinica-pc'||!o.state||typeof o.state!=='object')fail('El archivo no es una copia de seguridad de este sistema.');
  const st=o.state;for(const k of ['users','clients','devices','orders','items','moves','payments','audit'])if(!Array.isArray(st[k]))fail('La copia está incompleta o dañada ('+k+').');
  if(!st.cash||!Array.isArray(st.cash.sessions))fail('La copia está incompleta o dañada (caja).');
  if(!st.users.some(u=>u.role==='admin'&&u.active!==false))fail('La copia no tiene ningún administrador activo.');
  return migrate(st);
}
function cfgDatos(){
  return '<div class="grid g2"><div class="card"><h3>Copia de seguridad</h3><p class="mut sm">Los datos viven en este navegador. Descargá una copia periódicamente: si borrás los datos del navegador, se pierden.</p><div class="row"><button type="button" class="btn p" data-act="bkExport">'+ic('download',18)+'Descargar copia (.json)</button></div>'
   +'<h4 style="margin:16px 0 6px">Restaurar</h4><p class="mut sm">Reemplaza TODOS los datos actuales por los del archivo. Se valida antes de aplicar.</p><div class="field"><label for="bk-f">Archivo de copia</label><input type="file" id="bk-f" accept=".json,application/json" data-chg="bkFile"></div></div>'
   +'<div class="card"><h3>Datos de ejemplo</h3><p class="mut sm">Esta versión es una demo con datos de ejemplo. Podés volver al estado inicial cuando quieras.</p><button type="button" class="btn d" data-act="bkReset">Reiniciar la demo…</button></div></div>';}
ACTS.bkExport=()=>run(()=>{downloadText('copia-clinica-pc-'+dayKey(now())+'.json',backupJson(),'application/json');audit('COPIA_EXPORTADA','');saveNow();},'Copia descargada.');
CHG.bkFile=el=>{const f=el.files&&el.files[0];if(!f)return;if(f.size>40*1024*1024){toast('El archivo es demasiado grande.','bad');return;}const rd=new FileReader();rd.onload=()=>{let st;try{st=backupRestore(String(rd.result));}catch(e){if(e instanceof VBErr){toast(e.message,'bad');el.value='';return;}throw e;}
    confirmBox({title:'Restaurar copia',html:'Se van a reemplazar <b>todos</b> los datos actuales: '+st.orders.length+' órdenes, '+st.clients.length+' clientes, '+st.items.length+' artículos. No se puede deshacer.',confirmWord:'RESTAURAR',danger:true,ok:'Restaurar',onOk:()=>{S=st;if(!userById(SESSION.uid))SESSION.uid=(S.users.find(u=>u.role==='admin'&&u.active!==false)||S.users[0]).id;audit('COPIA_RESTAURADA','');saveNow();toast('Copia restaurada.','ok');renderApp();}});};
  rd.onerror=()=>toast('No se pudo leer el archivo.','bad');rd.readAsText(f);};
ACTS.bkReset=()=>confirmBox({title:'Reiniciar la demo',html:'Se borra todo lo que cargaste y vuelven los datos de ejemplo.',confirmWord:'REINICIAR',danger:true,ok:'Reiniciar',onOk:()=>{need('config');resetDemo();}});

}

/* =====================================================================
   ASISTENTE INTERNO: responde consultas de SOLO LECTURA con reglas de
   texto (no es una IA ni se conecta a ningún servicio). Respeta el rol:
   no muestra costos ni cobranzas a quien no tiene permiso.
   ===================================================================== */
const ASSIST=[];
function assistRule(name,re,perm,fn,hint){ASSIST.push({name,re,perm,fn,hint});}
const A_LINK=(to,label)=>'<a class="btn xs" href="#panel/'+to+'">'+esc(label)+'</a>';
assistRule('stock',/stock|falta(n)?\b|reponer|repuestos? bajos?/i,null,()=>{const l=lowItems();return l.length?{t:l.length+' artículo(s) con stock bajo o negativo:\n'+l.slice(0,8).map(i=>'• '+i.name+': '+fq(stockOf(i.id))+' (mínimo '+fq(i.min)+')').join('\n'),link:['inventario','Abrir inventario']}:{t:'No hay artículos por debajo del mínimo.'};},'«¿Qué stock está bajo?»');
assistRule('atrasadas',/atrasad|demora|retras/i,null,()=>{const l=lateOrders();return l.length?{t:l.length+' orden(es) atrasada(s):\n'+l.slice(0,8).map(o=>'• '+otCode(o)+' '+devLabel(orderDev(o))+' — '+ST[o.status].name+' hace '+dur(now()-o.stateSince)).join('\n'),link:['ordenes','Abrir el taller']}:{t:'No hay órdenes atrasadas.'};},'«¿Qué órdenes están atrasadas?»');
assistRule('listos',/list[oa]s?\b|retirar|para entregar/i,null,()=>{const l=S.orders.filter(o=>o.status==='listo');return l.length?{t:l.length+' equipo(s) listo(s) para retirar:\n'+l.map(o=>'• '+otCode(o)+' '+devLabel(orderDev(o))+' — '+clientName(o.clientId)).join('\n'),link:['ordenes','Abrir el taller']}:{t:'No hay equipos listos para retirar.'};},'«¿Qué equipos están listos?»');
assistRule('aprobacion',/aprobaci|esperando|presupuestos? pendientes?/i,null,()=>{const l=S.orders.filter(o=>o.status==='aprobacion');return l.length?{t:l.length+' presupuesto(s) esperando al cliente:\n'+l.map(o=>'• '+otCode(o)+' '+clientName(o.clientId)+(o.quote.validUntil?' (vence '+fdate(o.quote.validUntil)+')':'')).join('\n')}:{t:'No hay presupuestos esperando aprobación.'};},'«¿Qué presupuestos esperan aprobación?»');
assistRule('caja',/\bcaja\b|efectivo/i,'cash',()=>{const s=openSession();if(!s)return {t:'La caja está cerrada.',link:['caja','Ir a Caja']};const a=arqueoCalc(s);return {t:'Caja #'+s.n+' abierta desde '+fdt(s.openedAt)+'.\nEfectivo esperado: '+fmt(a.efectivoEsperado)+'\nCobrado en total: '+fmt(a.cobradoReal)+(a.pendienteDigital?'\nCobros digitales sin verificar: '+fmt(a.pendienteDigital):''),link:['caja','Ir a Caja']};},'«¿Cómo está la caja?»');
assistRule('hoy',/hoy|cobr(ado|amos|ó)|ingres(ó|os)|factur/i,'payments',()=>{const [a,b]=periodRange('hoy');const c=cobradoIn(a,b),r=revenueIn(a,b);return {t:'Hoy: cobrado '+fmt(c)+' (verificado, sin cuenta corriente).\nReparaciones entregadas: '+r.cnt+' ('+fmt(r.svc)+'). Ventas de mostrador: '+fmt(r.sales)+'.'};},'«¿Cuánto cobramos hoy?»');
assistRule('deuda',/deud|cuenta corriente|fiado/i,'payments',()=>{const l=S.clients.filter(c=>!c.anon&&ccBalance(c.id)>0).sort((a,b)=>ccBalance(b.id)-ccBalance(a.id));return l.length?{t:'Deuda de clientes: '+fmt(ccTotal())+'\n'+l.slice(0,6).map(c=>'• '+c.name+': '+fmt(ccBalance(c.id))).join('\n'),link:['clientes','Ver clientes']}:{t:'Ningún cliente tiene deuda.'};},'«¿Quién nos debe?»');

function assistAnswer(q){
  q=String(q||'').trim().slice(0,200);if(!q)return {t:'Escribí una consulta. Probá con «ayuda».'};
  for(const r of ASSIST){const m=r.re.exec(q);if(!m)continue;if(r.perm&&!can(r.perm))return {t:'Tu rol ('+ROLES[curUser().role].label+') no tiene acceso a esa información.'};return r.fn(m);}
  return {t:'No entendí la consulta. Escribí «ayuda» para ver qué puedo responder.'};
}

  saveNow().then(()=>{location.hash='#acceso';applyRoute();});
}
async function boot(){
  try{
    await DBX.open();const st=await DBX.get('state');
    if(st&&st.v&&st.seeded!==undefined){S=migrate(st);}
    else{S=seedDemo();await saveNow();}
  }catch(e){
    console.warn('Sin almacenamiento local: la demo funciona pero no guarda.',e);_noSave=true;_bootWarn='Este navegador no permite guardar datos: la demo funciona, pero al cerrar la pestaña se pierde lo que cargues.';
    if(!S)S=seedDemo();
  }
  try{const u=localStorage.getItem('vbc_uid');if(u&&userById(u)&&userById(u).active!==false)SESSION.uid=u;}catch(e){}
  if(SESSION.uid){try{if(scanSla())scheduleSave();}catch(e){console.error(e);}}
  applyRoute();
  if(_bootWarn)toast(_bootWarn,'bad');
  window.addEventListener('beforeunload',()=>{try{saveNow();}catch(e){}});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveNow();});
}
window.VBC={get S(){return S;},flush:()=>saveNow(),sha256,auditVerify,reset:()=>resetDemo(),login:id=>{SESSION.uid=id;try{localStorage.setItem('vbc_uid',id);}catch(e){}},ready:null};
window.VBC.ready=boot().catch(e=>{console.error('BOOT',e);document.getElementById('root').innerHTML='<div class="pub"><div class="wrap"><div class="alert bad" role="alert">No se pudo iniciar la aplicación: '+String(e&&e.message||e).replace(/[<>&]/g,'')+'</div></div></div>';});

</script>
